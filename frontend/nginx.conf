server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /app.mjs {
        types {
            application/javascript mjs;
        }
    }

    location /api/ {
        proxy_pass http://kubelab-api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
